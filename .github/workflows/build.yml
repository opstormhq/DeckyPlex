name: Build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record tested commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/check-release-versions.mjs . "$GITHUB_REF_NAME"
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run check
      - name: Run frontend tests
        run: npm test
      - name: Install Chromium for UI tests
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Run browser UI tests
        run: npm run test:ui
      - name: Upload UI screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: test-results/ui/
          if-no-files-found: ignore
      - name: Build the install ZIP
        run: npm run package
      - run: node --check dist/index.js
      - name: Run backend and package tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          path: DeckyPlex.zip
          archive: false
          if-no-files-found: error

  release-versions:
    name: Check edited release PR versions
    # Bot updates get their status from the main run that creates or updates the PR.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node scripts/check-release-versions.mjs

  propose-version:
    name: Propose the next version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: deckyplex-release-pr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Check that the initial release is published
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '
            .[] | select(.tag_name == "v1.0.0" and .draft == false) | .tag_name')"
          if [[ "$published" == v1.0.0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Automatic version proposals start after v1.0.0 is published.'
          fi
      - name: Update the release pull request
        id: release-please
        if: steps.baseline.outputs.ready == 'true'
        uses: googleapis/release-please-action@v5
        with:
          skip-github-release: true
      - name: Find the release PR commit
        id: release-pr
        if: steps.release-please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ fromJSON(steps.release-please.outputs.pr).number }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" --jq '.head.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check the release PR version files
        id: release-versions
        if: steps.release-pr.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-pr.outputs.sha }}
        run: |
          versions_dir="$(mktemp -d)"
          for file in package.json package-lock.json .release-please-manifest.json; do
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/$file?ref=$RELEASE_SHA" > "$versions_dir/$file"
          done
          node scripts/check-release-versions.mjs "$versions_dir"
      - name: Report the version check on the release PR
        if: ${{ !cancelled() && steps.release-pr.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-pr.outputs.sha }}
          CHECK_STATE: ${{ steps.release-versions.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f context='Release version files' -f state="$CHECK_STATE" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: release-${{ github.ref }}
    env:
      RELEASE_ZIP: DeckyPlex-${{ github.ref_name }}.zip
    steps:
      - name: Download and verify the install ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RELEASE_ZIP"
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" "$RELEASE_ZIP" | sha256sum -c -
          unzip -tq "$RELEASE_ZIP"
      - name: Attach ZIP to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$GITHUB_REF_NAME" "$RELEASE_ZIP" --clobber
            else
              echo "$GITHUB_REF_NAME is already published."
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_ZIP" --draft --verify-tag --generate-notes
          fi
      - name: Clear the release PR's pending label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          pulls="$(gh api "repos/$GH_REPO/commits/$RELEASE_COMMIT/pulls" --jq \
            '.[] | select(.merged_at and .base.ref == "main" and any(.labels[]; .name == "autorelease: pending")) | .number')"
          for pull in $pulls; do
            gh api --silent --method DELETE "repos/$GH_REPO/issues/$pull/labels/autorelease%3A%20pending"
          done
